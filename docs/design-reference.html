  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 border-bottom: 1px solid rgba(245, 239, 229, 0.12)\">Experts<\u002Fa>\n<a href=\"#faq\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #f5efe5; text-decoration: none; font-size: 16px; padding: 14px 0; border-bottom: 1px solid rgba(245, 239, 229, 0.12)\">FAQ<\u002Fa>\n<a href=\"#start\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #c4a46f; text-decoration: none; font-size: 16px; font-weight: 500; padding: 14px 0\">Let’s Talk<\u002Fa>\n<\u002Fnav>\n<\u002Fsc-if>\n<\u002Fheader>\n\n<div style=\"max-width: 1200px; margin: 0 auto; padding: clamp(56px, 8vw, 104px) clamp(20px, 4vw, 40px) 56px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 40px 80px\">\n<div style=\"flex: 1 1 560px; min-width: 0\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #c4a46f\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #c4a46f\"><\u002Fspan>For Indian founders and NRI &amp; HNI investors<\u002Fp>\n<h1 style=\"margin: 24px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(44px, 5.4vw, 72px); line-height: 1.04; letter-spacing: -0.015em; text-wrap: balance\">Indian ventures, independently verified and clearly told.<\u002Fh1>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 32px\">\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #c3c6cc; max-width: 460px\">Nivesha Ventures helps NRI and HNI investors see Indian ventures as they really are, and helps founders tell their story with the clarity investors need. We never hold or move investor funds.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"#for-investors\" style=\"display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 22px; box-sizing: border-box; background: #c4a46f; color: #0c1826; text-decoration: none; font-size: 15px; font-weight: 600\">I’m Looking to Invest<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1.5 7h10.5M8 3l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"#for-founders\" style=\"display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 22px; box-sizing: border-box; background: transparent; color: #f5efe5; border: 1px solid rgba(245, 239, 229, 0.55); text-decoration: none; font-size: 15px; font-weight: 500\">I’m Seeking Capital<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1.5 7h10.5M8 3l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box\">\n<img src=\"bca76643-4750-4b4a-8f73-ed8b84534a21\" alt=\"Two stone blocks joined by a brass bridge\" style=\"display: block; width: 100%; height: auto; aspect-ratio: 1120 / 450; object-fit: cover\">\n<ul aria-label=\"What Nivesha offers\" style=\"list-style: none; margin: 0; padding: 28px 0 44px; border-top: 1px solid rgba(196, 164, 111, 0.35); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #c3c6cc\">\n<li>Independent due diligence<\u002Fli>\n<li>Venture stories, clearly told<\u002Fli>\n<li>No funds pass through us<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"for-investors\" style=\"background: #f5efe5; padding: clamp(72px, 9vw, 120px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 56px 80px\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #b39463\"><\u002Fspan>01 / For NRI &amp; HNI investors<\u002Fp>\n<h2 style=\"margin: 20px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance\">See the venture as it really is.<\u002Fh2>\n<p style=\"margin: 24px 0 0; font-size: 17px; line-height: 1.7; color: #4c5262; max-width: 520px\">From abroad, or from outside an industry, it is hard to tell which claims hold up. Nivesha closes that information gap with independent due diligence, so you can judge an Indian venture on evidence rather than on its pitch.<\u002Fp>\n<a href=\"#start\" sc-camel-on-click=\"{{ chooseInvestor }}\" style=\"margin-top: 36px; display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 22px; box-sizing: border-box; background: #0c1826; color: #f5efe5; text-decoration: none; font-size: 15px; font-weight: 500\">Tell Us Your Investment Interests<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1.5 7h10.5M8 3l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<div style=\"flex: 1 1 440px; min-width: 0; box-sizing: border-box; background: #fbf8f2; border: 1px solid #ddd2bf; padding: clamp(28px, 3vw, 40px)\">\n<p style=\"margin: 0 0 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\">What you receive<\u002Fp>\n<ol style=\"list-style: none; margin: 0; padding: 0\">\n<li style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 8px; padding: 24px 0; border-bottom: 1px solid #e3d6bf\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; color: #7a5c2e\">01<\u002Fspan>\n<div><p style=\"margin: 0; font-size: 16px; font-weight: 600\">An independent diligence brief<\u002Fp><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #4c5262\">Financials, legal standing, team, and market claims, checked against evidence.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 8px; padding: 24px 0; border-bottom: 1px solid #e3d6bf\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; color: #7a5c2e\">02<\u002Fspan>\n<div><p style=\"margin: 0; font-size: 16px; font-weight: 600\">The open questions<\u002Fp><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #4c5262\">What we could not confirm, and what is worth asking the founder.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 8px; padding: 24px 0 0\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; color: #7a5c2e\">03<\u002Fspan>\n<div><p style=\"margin: 0; font-size: 16px; font-weight: 600\">A direct introduction<\u002Fp><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #4c5262\">Meet the founder yourself and invest directly. Funds never pass through Nivesha.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"for-founders\" style=\"background: #ece3d4; padding: clamp(72px, 9vw, 120px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box; display: flex; flex-direction: row-reverse; flex-wrap: wrap; align-items: center; gap: 56px 80px\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #b39463\"><\u002Fspan>02 / For founders in India<\u002Fp>\n<h2 style=\"margin: 20px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance\">Tell your story the way investors need to hear it.<\u002Fh2>\n<p style=\"margin: 24px 0 0; font-size: 17px; line-height: 1.7; color: #4c5262; max-width: 540px\">A strong business can still lose an investor to an unclear pitch. We help you set out your problem, model, traction, team, and capital need in a form investors can follow and check.<\u002Fp>\n<p style=\"margin: 16px 0 0; font-size: 17px; line-height: 1.7; color: #4c5262; max-width: 540px\">Ventures that complete our diligence are introduced to NRI and HNI investors whose interests fit what you are building.<\u002Fp>\n<a href=\"#start\" sc-camel-on-click=\"{{ chooseSeeker }}\" style=\"margin-top: 36px; display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 22px; box-sizing: border-box; background: #0c1826; color: #f5efe5; text-decoration: none; font-size: 15px; font-weight: 500\">Introduce Your Venture<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1.5 7h10.5M8 3l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<div style=\"flex: 1 1 440px; min-width: 0; box-sizing: border-box; background: #fbf8f2; border: 1px solid #d6c9b2; padding: clamp(28px, 3vw, 40px)\">\n<p style=\"margin: 0 0 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\">Your venture story<\u002Fp>\n<ol style=\"list-style: none; margin: 0; padding: 0\">\n<li style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 8px; padding: 24px 0; border-bottom: 1px solid #e3d6bf\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; color: #7a5c2e\">01<\u002Fspan>\n<div><p style=\"margin: 0; font-size: 16px; font-weight: 600\">What you are building<\u002Fp><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #4c5262\">Your problem, solution, and business model.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 8px; padding: 24px 0; border-bottom: 1px solid #e3d6bf\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; color: #7a5c2e\">02<\u002Fspan>\n<div><p style=\"margin: 0; font-size: 16px; font-weight: 600\">What you have proven<\u002Fp><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #4c5262\">Traction, milestones, and the evidence behind them.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 8px; padding: 24px 0 0\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; color: #7a5c2e\">03<\u002Fspan>\n<div><p style=\"margin: 0; font-size: 16px; font-weight: 600\">What the capital will do<\u002Fp><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: #4c5262\">How much you need and what it will help you achieve.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"diligence\" style=\"background: #f5efe5; padding: clamp(72px, 9vw, 120px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 80px\">\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #b39463\"><\u002Fspan>03 / Due diligence<\u002Fp>\n<h2 style=\"margin: 20px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance\">What we verify before an introduction.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"flex: 1 1 360px; min-width: 0; margin: 0; font-size: 17px; line-height: 1.7; color: #4c5262; max-width: 460px\">Every venture is reviewed across the same six areas. Investors see where the evidence is strong, where it is thin, and what remains open.<\u002Fp>\n<\u002Fdiv>\n<ul style=\"list-style: none; margin: 56px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 40px\">\n<li style=\"border-top: 1px solid #b39463; padding-top: 20px\">\n<h3 style=\"margin: 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 24px; line-height: 1.25\">Financials<\u002Fh3>\n<p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.7; color: #4c5262\">Reported revenue, margins, and cash, checked against bank statements and GST filings.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 1px solid #b39463; padding-top: 20px\">\n<h3 style=\"margin: 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 24px; line-height: 1.25\">Legal &amp; compliance<\u002Fh3>\n<p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.7; color: #4c5262\">Incorporation, cap table, statutory filings, licences, and any pending disputes.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 1px solid #b39463; padding-top: 20px\">\n<h3 style=\"margin: 0; font-fami  12px; font-weight: 600; padding: 5px 10px; background: #0c1826; color: #f5efe5\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2 6.2l2.6 2.6L10 3.4\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Verified<\u002Fspan>\n<\u002Fli>\n<li style=\"padding: 18px clamp(20px, 3vw, 32px); border-top: 1px solid #ece3d4; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0\"><p style=\"margin: 0; font-size: 15px; font-weight: 600\">Legal &amp; compliance<\u002Fp><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.55; color: #4c5262\">Incorporation, cap table, and statutory filings are in order.<\u002Fp><\u002Fdiv>\n<span style=\"flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 10px; background: #0c1826; color: #f5efe5\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2 6.2l2.6 2.6L10 3.4\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Verified<\u002Fspan>\n<\u002Fli>\n<li style=\"padding: 18px clamp(20px, 3vw, 32px); border-top: 1px solid #ece3d4; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0\"><p style=\"margin: 0; font-size: 15px; font-weight: 600\">Founders &amp; team<\u002Fp><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.55; color: #4c5262\">Backgrounds and references confirmed for both founders.<\u002Fp><\u002Fdiv>\n<span style=\"flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 10px; background: #0c1826; color: #f5efe5\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" aria-hidden=\"true\"><path d=\"M2 6.2l2.6 2.6L10 3.4\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>Verified<\u002Fspan>\n<\u002Fli>\n<li style=\"padding: 18px clamp(20px, 3vw, 32px); border-top: 1px solid #ece3d4; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0\"><p style=\"margin: 0; font-size: 15px; font-weight: 600\">Market &amp; customers<\u002Fp><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.55; color: #4c5262\">Market size relies on a single third-party estimate. Customer calls support demand.<\u002Fp><\u002Fdiv>\n<span style=\"flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 9px; border: 1px solid #7a5c2e; color: #7a5c2e\">Partly verified<\u002Fspan>\n<\u002Fli>\n<li style=\"padding: 18px clamp(20px, 3vw, 32px); border-top: 1px solid #ece3d4; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0\"><p style=\"margin: 0; font-size: 15px; font-weight: 600\">Business model<\u002Fp><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.55; color: #4c5262\">Margins depend on a supplier contract that is due for renewal.<\u002Fp><\u002Fdiv>\n<span style=\"flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 9px; border: 1px dashed #4c5262; color: #4c5262\">Open question<\u002Fspan>\n<\u002Fli>\n<\u002Ful>\n<div style=\"padding: 24px clamp(20px, 3vw, 32px); border-top: 1px solid #e3d6bf; background: #fbf8f2\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\">Questions worth asking the founder<\u002Fp>\n<ol style=\"margin: 12px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #121a29\">\n<li>What happens to margins if the supplier contract is renegotiated?<\u002Fli>\n<li>Which customers account for most of the revenue today?<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<p style=\"margin: 0; padding: 16px clamp(20px, 3vw, 32px); border-top: 1px solid #e3d6bf; font-size: 13px; color: #4c5262\">Prepared by Nivesha Ventures · Shared with the investor as written<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"independence\" style=\"background: #f5efe5; padding: clamp(72px, 9vw, 120px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 80px\">\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #b39463\"><\u002Fspan>07 / Our role<\u002Fp>\n<h2 style=\"margin: 20px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance\">Independent by design.<\u002Fh2>\n<p style=\"margin: 24px 0 0; font-size: 17px; line-height: 1.7; color: #4c5262; max-width: 420px\">Investors need to trust what we tell them, and founders need to know how their story is used. These are the commitments behind our work.<\u002Fp>\n<\u002Fdiv>\n<ol style=\"flex: 1 1 560px; min-width: 0; list-style: none; margin: 0; padding: 0\">\n<li style=\"display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 8px; padding: 0 0 32px; border-bottom: 1px solid #d6c9b2\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 36px; line-height: 1; color: #7a5c2e\">01<\u002Fspan>\n<div><h3 style=\"margin: 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 28px; line-height: 1.2\">We never hold or move your money.<\u002Fh3><p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.7; color: #4c5262\">Investors invest directly in the company through their own banking channels. Nivesha does not pool, hold, or transfer funds.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 8px; padding: 32px 0; border-bottom: 1px solid #d6c9b2\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 36px; line-height: 1; color: #7a5c2e\">02<\u002Fspan>\n<div><h3 style=\"margin: 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 28px; line-height: 1.2\">Each side pays for its own work.<\u002Fh3><p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.7; color: #4c5262\">Founders pay for help preparing their venture story. Investors pay for due diligence.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<li style=\"display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 8px; padding: 32px 0 0\">\n<span aria-hidden=\"true\" style=\"font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 36px; line-height: 1; color: #7a5c2e\">03<\u002Fspan>\n<div><h3 style=\"margin: 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 28px; line-height: 1.2\">Findings are shared as written.<\u002Fh3><p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.7; color: #4c5262\">Helping a founder tell their story never changes what our diligence finds. Investors receive our findings unedited.<\u002Fp><\u002Fdiv>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how-it-works\" style=\"background: #ece3d4; padding: clamp(72px, 9vw, 120px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #b39463\"><\u002Fspan>08 / How it works<\u002Fp>\n<h2 style=\"margin: 20px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -0.01em\">From first conversation to introduction.<\u002Fh2>\n<ol style=\"list-style: none; margin: 56px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 40px 32px\">\n<li style=\"border-top: 1px solid #121a29; padding-top: 24px\">\n<span aria-hidden=\"true\" style=\"display: block; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 48px; line-height: 1; color: #7a5c2e\">01<\u002Fspan>\n<h3 style=\"margin: 24px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Share your goals.<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #4c5262\">Founders tell us about the venture and funding need. Investors share their interests and preferences.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 1px solid #121a29; padding-top: 24px\">\n<span aria-hidden=\"true\" style=\"display: block; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 48px; line-height: 1; color: #7a5c2e\">02<\u002Fspan>\n<h3 style=\"margin: 24px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Shape and verify.<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #4c5262\">We work with founders on their story while reviewing the evidence behind it independently.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 1px solid #121a29; padding-top: 24px\">\n<span aria-hidden=\"true\" style=\"display: block; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 48px; line-height: 1; color: #7a5c2e\">03<\u002Fspan>\n<h3 style=\"margin: 24px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Review the brief.<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #4c5262\">Investors whose interests fit receive the diligence brief, including the open questions.<\u002Fp>\n<\u002Fli>\n<li style=\"border-top: 1px solid #121a29; padding-top: 24px\">\n<span aria-hidden=\"true\" style=\"display: block; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 48px; line-height: 1; color: #7a5c2e\">04<\u002Fspan>\n<h3 style=\"margin: 24px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Meet directly.<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #4c5262\">If both sides want to proceed, we introduce you. The investment is made directly between you.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"background: #f5efe5; padding: clamp(72px, 9vw, 120px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px 80px\">\n<div style=\"flex: 1 1 320px; min-width: 0\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #b39463\"><\u002Fspan>09 / Questions<\u002Fp>\n<h2 style=\"margin: 20px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -0.01em\">Before you get in touch.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1 1 600px; min-width: 0; border-bottom: 1px solid #d6c9b2\">\n<details style=\"border-top: 1px solid #d6c9b2\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; color: #121a29\">Who do you work with during the pilot?<svg class=\"nv-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M8 2v12M2 8h12\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.7; color: #4c5262\">Founders of ventures in India who are raising capital, and individual NRI and HNI investors. We are not working with venture capital funds during the pilot.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-top: 1px solid #d6c9b2\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; color: #121a29\">Do you handle or hold investment money?<svg class=\"nv-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M8 2v12M2 8h12\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.7; color: #4c5262\">No. Investors invest directly in the company through their own banking channels. Nivesha does not pool, hold, or transfer funds.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-top: 1px solid #d6c9b2\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; color: #121a29\">Who pays Nivesha, and how much?<svg class=\"nv-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M8 2v12M2 8h12\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.7; color: #4c5262\">Founders pay for venture story preparation, and investors pay for due diligence. <span style=\"color: #7a5c2e; font-weight: 500\">[Fee structure to be confirmed]<\u002Fspan><\u002Fp>\n<\u002Fdetails>\n<details style=\"border-top: 1px solid #d6c9b2\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; color: #121a29\">If founders pay you, how is your diligence independent?<svg class=\"nv-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M8 2v12M2 8h12\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.7; color: #4c5262\">Story preparation and due diligence are separate pieces of work. Investors receive our diligence findings as written, whether or not a founder has worked with us on their story.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-top: 1px solid #d6c9b2\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; color: #121a29\">How is my information kept confidential?<svg class=\"nv-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M8 2v12M2 8h12\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.7; color: #4c5262\"><span style=\"color: #7a5c2e; font-weight: 500\">[Confidentiality terms to be confirmed: what is shared, with whom, and under what agreement]<\u002Fspan><\u002Fp>\n<\u002Fdetails>\n<details style=\"border-top: 1px solid #d6c9b2\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; color: #121a29\">Can I invest in an Indian venture as an NRI?<svg class=\"nv-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M8 2v12M2 8h12\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.7; color: #4c5262\">The rules depend on the company’s sector and how the investment is structured, so confirm your route with your own legal and tax advisers before investing.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-top: 1px solid #d6c9b2\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.3; color: #121a29\">How long does the process take?<svg class=\"nv-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"flex: none\"><path d=\"M8 2v12M2 8h12\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 40px 24px 0; font-size: 16px; line-height: 1.7; color: #4c5262\"><span style=\"color: #7a5c2e; font-weight: 500\">[Typical timeline from first conversation to introduction, to be confirmed]<\u002Fspan><\u002Fp>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"start\" style=\"background: #ece3d4; padding: clamp(72px, 9vw, 120px) 0\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 80px\">\n<div style=\"flex: 1 1 400px; min-width: 0\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c2e\"><span aria-hidden=\"true\" style=\"flex: none; width: 32px; height: 1px; background: #b39463\"><\u002Fspan>10 / Start a conversation<\u002Fp>\n<h2 style=\"margin: 20px 0 0; font-family: Newsreader, Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance\">Let’s understand what you’re looking to achieve.<\u002Fh2>\n<p style=\"margin: 24px 0 0; font-size: 17px; line-height: 1.7; color: #4c5262; max-width: 480px\">Whether you are raising capital for a venture in India or looking for independently verified opportunities, start a conversation with Nivesha Ventures.<\u002Fp>\n<\u002Fdiv>\n<form aria-label=\"Enquiry\" style=\"flex: 1 1 480px; min-width: 0; box-sizing: border-box; background: #fbf8f2; border: 1px solid #d6c9b2; padding: clamp(24px, 3vw, 40px); display: flex; flex-direction: column; gap: 20px\">\n<div role=\"group\" aria-label=\"I am\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #121a29\">\n<button type=\"button\" aria-pressed=\"{{ invPressed }}\" sc-camel-on-click=\"{{ chooseInvestor }}\" style=\"min-height: 52px; padding: 0 12px; border: 0; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; background: {{ invBg }}; color: {{ invFg }}\">I Want to Invest<\u002Fbutton>\n<button type=\"button\" aria-pressed=\"{{ seekPressed }}\" sc-camel-on-click=\"{{ chooseSeeker }}\" style=\" gia, 'Times New Roman', serif; font-size: 18px; font-weight: 500; letter-spacing: 0.2em\">NIVESHA VENTURES<\u002Fp>\n<p style=\"margin: 0; font-size: 14px; color: #c3c6cc\">Independent due diligence. Clearer venture stories.<\u002Fp>\n<\u002Fdiv>\n<nav aria-label=\"Footer\" style=\"display: flex; flex-wrap: wrap; gap: 8px 32px\">\n<a href=\"#experts\" style=\"color: #f5efe5; text-decoration: none; font-size: 14px; padding: 12px 0\">Our Experts<\u002Fa>\n<a href=\"#faq\" style=\"color: #f5efe5; text-decoration: none; font-size: 14px; padding: 12px 0\">FAQ<\u002Fa>\n<a href=\"#start\" style=\"color: #f5efe5; text-decoration: none; font-size: 14px; padding: 12px 0\">Contact<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<p style=\"margin: 32px 0 0; padding-top: 24px; border-top: 1px solid rgba(196, 164, 111, 0.28); font-size: 13px; line-height: 1.6; color: #c3c6cc; max-width: 820px\">Nivesha Ventures does not hold, pool, or transfer investor funds. <span style=\"color: #c4a46f\">[Regulatory disclaimer to be confirmed with legal counsel]<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:9800}}\">\nclass Component extends DCLogic {\nrenderVals() {\nconst st = this.state || {};\nconst isInvestor = (st.route || 'investor') === 'investor';\nconst menuOpen = !!st.menuOpen;\nreturn {\nisInvestor: isInvestor,\nisSeeker: !isInvestor,\ninvBg: isInvestor ? '#0c1826' : 'transparent',\ninvFg: isInvestor ? '#f5efe5' : '#121a29',\nseekBg: isInvestor ? 'transparent' : '#0c1826',\nseekFg: isInvestor ? '#121a29' : '#f5efe5',\ninvPressed: isInvestor ? 'true' : 'false',\nseekPressed: isInvestor ? 'false' : 'true',\nsubmitLabel: isInvestor ? 'Discuss Investment Interests' : 'Discuss Funding Needs',\nchooseInvestor: () => this.setState({ route: 'investor' }),\nchooseSeeker: () => this.setState({ route: 'seeker' }),\nmenuOpen: menuOpen,\nmenuExpanded: menuOpen ? 'true' : 'false',\ntoggleMenu: () => this.setState({ menuOpen: !menuOpen }),\ncloseMenu: () => this.setState({ menuOpen: false })\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
